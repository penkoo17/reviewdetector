<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Detector — See through the stars before you buy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./public/css/variables.css" />
  <link rel="stylesheet" href="./public/css/layout.css" />
  <link rel="stylesheet" href="./public/css/components.css" />
</head>
<body>
  <header class="navbar-wrap">
    <div class="navbar-pill">
      <div class="brand-logo" id="brandHomeBtn" title="Beranda">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.3-4.3"/>
            <path d="M11 7.5 12.1 9.8l2.5.4-1.8 1.7.4 2.5-2.2-1.2-2.2 1.2.4-2.5-1.8-1.7 2.5-.4z"/>
          </svg>
        </div>
        <div class="brand-text-wrap">
          <span class="brand-name">Review Detector</span>
          <span class="brand-tagline">See through the stars before you buy</span>
        </div>
      </div>

      <nav class="desktop-nav-links" aria-label="Navigasi Desktop">
        <button type="button" class="nav-btn active" data-nav="landing">Beranda</button>
        <button type="button" class="nav-btn" data-nav="analyzer">Periksa Produk</button>
        <button type="button" class="nav-btn" data-nav="report" id="navReportBtn">Laporan</button>
        <button type="button" class="nav-btn" data-nav="history">Riwayat</button>
      </nav>

      <div class="nav-actions">
        <button type="button" class="btn btn-primary btn-sm" id="headerStartBtn">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Cek Baru</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div id="appViewRoot"></div>
    </div>
  </main>

  <nav class="mobile-bottom-nav" aria-label="Navigasi Mobile">
    <button type="button" class="mobile-nav-item active" data-nav="landing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Beranda</span>
    </button>
    <button type="button" class="mobile-nav-item" data-nav="analyzer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <span>Periksa</span>
    </button>
    <button type="button" class="mobile-nav-item" data-nav="report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span>Laporan</span>
    </button>
    <button type="button" class="mobile-nav-item" data-nav="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>Riwayat</span>
    </button>
  </nav>

  <div class="modal-backdrop hidden" id="appModalBackdrop" role="dialog" aria-modal="true">
    <div class="modal-card" id="appModalContent"></div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <strong>Review Detector</strong> &mdash; See through the stars before you buy.
      </div>
      <div>
        Pemeriksaan Ulasan E-Commerce
      </div>
    </div>
  </footer>

  <script src="./public/js/runtime.js"></script>
</body>
</html>
